name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile helpers
        run: python -m compileall -q scripts tests
      - name: Validate runtime configurations
        run: |
          python scripts/runtime_config.py validate --runtime codex --config config/runtimes/codex.json
          python scripts/runtime_config.py validate --runtime hermes --config config/runtimes/hermes.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
