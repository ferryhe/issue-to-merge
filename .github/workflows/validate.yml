name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile state helper
        run: python -m py_compile scripts/review_cycle.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
